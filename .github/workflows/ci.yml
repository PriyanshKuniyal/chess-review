# Quick checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Syntax check
        run: for f in server.js lib/*.js public/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Download Stockfish
        run: node scripts/setup.mjs --skip-ollama
      - name: Review a game end to end
        run: node scripts/smoke-test.mjs
