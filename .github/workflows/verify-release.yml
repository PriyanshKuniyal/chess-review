# Downloads a published release zip on a clean Windows machine and checks that it works using
# only what's inside it (bundled Node.js, Stockfish and dependencies). Run it from the Actions tab.
name: Verify release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (e.g. v1.0.0)
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download and unpack the release
        shell: pwsh
        run: |
          gh release download $env:TAG --repo "${{ github.repository }}" --pattern "*.zip" --dir dl
          Expand-Archive (Get-ChildItem dl/*.zip).FullName -DestinationPath app

      - name: Test the unpacked app
        shell: pwsh
        run: ./.github/scripts/test-package.ps1 "app/Chess Review"
